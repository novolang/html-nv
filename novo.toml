[package]
name        = "html-nv"
version     = "0.1.0"
description = "Tolerant HTML5: the tokenizer as the specification writes it, a flat-arena tree over the source with a named subset of the tree-construction algorithm and its four refusals reported, finding nodes by tag or by a named subset of CSS, a serialiser, and escaping and sanitising as separate functions with the allow-list as a value."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  A tokenizer over a string the caller already holds, a tree
# of indices, and a serialiser that answers bytes.  Nothing is fetched:
# a document's `<img src>` and `<script src>` are reported and never
# followed.
layer       = "core"

category    = "web"

tags        = ["html", "html5", "parser", "tolerant", "dom", "css-selector", "sanitize", "escape", "scraping", "sans-io"]
repository  = "https://github.com/novolang/html-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Tolerant HTML, and the difference between escaping and sanitising"

[dependencies]
# None.  HTML matches tag and attribute names ASCII
# case-insensitively, so no Unicode table is needed.  The one large
# table, the 2231 named character references, is HTML's own and lives
# in `src/htmlentity.nv`.  A numeric reference naming a surrogate
# becomes U+FFFD by a range check, and a URL scheme is ASCII under
# RFC 3986.
